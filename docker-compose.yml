

services:
  wifi-login:
    build:
      context: ./Wifi_AutoLogin
    container_name: wifi-auto-login
    restart: always
    network_mode: host
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://www.google.com"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai_network
    environment:
      - OLLAMA_NUM_CTX=4096

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://172.17.0.1:11434
      - WEBUI_AUTH=true
    networks:
      - ai_network
    depends_on:
      - ollama

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - ai_network

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/

  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: browserless
    ports:
      - "3001:3000"
    environment:
      - TOKEN=my_secret_pi_key_123
      - CONCURRENT_SESSIONS=3
      - TIMEOUT=10000
    restart: unless-stopped

  akane-bot:
    build: .
    container_name: akane_discord_bot
    restart: unless-stopped
    env_file:
      - .env

networks:
  ai_network:
    driver: bridge

volumes:
  ollama_data:
  open_webui_data:
  portainer_data:
